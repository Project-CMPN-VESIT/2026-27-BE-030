[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Same SPA fallback as public/_redirects, kept here so the setting survives even
# if the public/ file is removed.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed build assets never change content, so they can be cached hard.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # The AI Buddy screen needs the mic; everything else is denied.
    Permissions-Policy = "camera=(), geolocation=(), microphone=(self)"
